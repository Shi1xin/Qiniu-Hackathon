openapi: 3.0.3
info:
  title: CLI Navigation Tool API
  description: Internal API contracts for CLI navigation tool components
  version: 1.0.0
  contact:
    name: CLI Navigation Tool Team
  license:
    name: MIT

paths:
  # Location Parser API
  /api/v1/parse:
    post:
      summary: Parse natural language navigation query
      description: Extract origin and destination from natural language input
      operationId: parseNavigationQuery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseRequest'
      responses:
        '200':
          description: Successfully parsed navigation query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseResponse'
        '400':
          description: Invalid input format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable entity (validation errors)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # URL Construction API
  /api/v1/construct-url:
    post:
      summary: Construct navigation URL
      description: Build mapping service URL from parsed locations
      operationId: constructNavigationUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UrlConstructionRequest'
      responses:
        '200':
          description: Successfully constructed navigation URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UrlConstructionResponse'
        '400':
          description: Invalid location data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Browser Automation API
  /api/v1/browser/launch:
    post:
      summary: Launch browser with navigation URL
      description: Launch browser and navigate to mapping service
      operationId: launchBrowserNavigation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrowserLaunchRequest'
      responses:
        '200':
          description: Successfully launched browser
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserLaunchResponse'
        '400':
          description: Invalid browser configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Browser launch failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Health Check API
  /api/v1/health:
    get:
      summary: Health check
      description: Check system health and dependencies
      operationId: healthCheck
      responses:
        '200':
          description: System healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

components:
  schemas:
    # Request Schemas
    ParseRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          description: Natural language navigation query
          minLength: 3
          maxLength: 200
          examples:
            - "从北京到上海"
            - "中关村到三里屯"
            - "天安门到故宫"
        options:
          type: object
          description: Parsing options
          properties:
            method:
              type: string
              enum: [auto, regex, nlp, llm]
              default: auto
              description: Preferred parsing method
            language:
              type: string
              enum: [zh, en, auto]
              default: zh
              description: Input language
            timeout_ms:
              type: integer
              minimum: 100
              maximum: 5000
              default: 1500
              description: Parsing timeout in milliseconds

    UrlConstructionRequest:
      type: object
      required:
        - origin
        - destination
      properties:
        origin:
          $ref: '#/components/schemas/LocationInput'
        destination:
          $ref: '#/components/schemas/LocationInput'
        options:
          type: object
          properties:
            service_provider:
              type: string
              enum: [gaode, baidu, tencent]
              default: gaode
              description: Mapping service provider
            transport_mode:
              type: string
              enum: [car, walk, bus, ride, truck]
              default: car
              description: Preferred transport mode
            avoid_tolls:
              type: boolean
              default: false
              description: Avoid toll roads
            avoid_highways:
              type: boolean
              default: false
              description: Avoid highways

    BrowserLaunchRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          description: Navigation URL to open
          examples:
            - "https://uri.amap.com/navigation?from=北京&to=上海&mode=car"
        options:
          type: object
          properties:
            browser_type:
              type: string
              enum: [chromium, firefox, webkit]
              default: chromium
              description: Browser type to launch
            headless:
              type: boolean
              default: false
              description: Run browser in headless mode
            timeout_ms:
              type: integer
              minimum: 1000
              maximum: 10000
              default: 5000
              description: Browser launch timeout
            keep_open:
              type: boolean
              default: true
              description: Keep browser open after navigation

    LocationInput:
      type: object
      required:
        - name
        - type
        - confidence
      properties:
        name:
          type: string
          description: Location name
          minLength: 1
          maxLength: 100
          examples:
            - "北京"
            - "中关村"
            - "天安门"
        type:
          type: string
          enum: [city, district, landmark, transport, university, address, unknown]
          description: Location type
        confidence:
          type: number
          format: float
          minimum: 0.5
          maximum: 1.0
          description: Confidence score
        context:
          type: string
          description: Additional context for disambiguation
        alternatives:
          type: array
          items:
            type: string
          description: Alternative location names

    # Response Schemas
    ParseResponse:
      type: object
      required:
        - success
        - data
        - metadata
      properties:
        success:
          type: boolean
          description: Whether parsing was successful
        data:
          $ref: '#/components/schemas/NavigationQueryData'
        metadata:
          $ref: '#/components/schemas/ProcessingMetadata'

    UrlConstructionResponse:
      type: object
      required:
        - success
        - data
        - metadata
      properties:
        success:
          type: boolean
          description: Whether URL construction was successful
        data:
          $ref: '#/components/schemas/UrlData'
        metadata:
          $ref: '#/components/schemas/ProcessingMetadata'

    BrowserLaunchResponse:
      type: object
      required:
        - success
        - data
        - metadata
      properties:
        success:
          type: boolean
          description: Whether browser launch was successful
        data:
          $ref: '#/components/schemas/BrowserSessionData'
        metadata:
          $ref: '#/components/schemas/ProcessingMetadata'

    HealthResponse:
      type: object
      required:
        - status
        - timestamp
        - components
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
          description: Overall system health
        timestamp:
          type: string
          format: date-time
          description: Health check timestamp
        components:
          type: object
          description: Component health status
          properties:
            nlp_service:
              type: object
              properties:
                status:
                  type: string
                  enum: [healthy, unhealthy]
                response_time_ms:
                  type: integer
                version:
                  type: string
            browser_service:
              type: object
              properties:
                status:
                  type: string
                  enum: [healthy, unhealthy]
                available_browsers:
                  type: array
                  items:
                    type: string
                version:
                  type: string
            llm_service:
              type: object
              properties:
                status:
                  type: string
                  enum: [healthy, unhealthy]
                response_time_ms:
                  type: integer
                model:
                  type: string

    NavigationQueryData:
      type: object
      required:
        - origin
        - destination
        - query_type
      properties:
        origin:
          $ref: '#/components/schemas/LocationEntity'
        destination:
          $ref: '#/components/schemas/LocationEntity'
        query_type:
          type: string
          enum: [city_to_city, district_to_district, landmark_to_landmark, transport_to_transport, university_to_university, unknown]
          description: Type of navigation query
        confidence_score:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          description: Overall parsing confidence
        parsing_method:
          type: string
          description: Method used for parsing
        needs_clarification:
          type: boolean
          description: Whether user input needs clarification
        suggestions:
          type: array
          items:
            type: string
          description: Suggestions for user

    UrlData:
      type: object
      required:
        - navigation_url
        - service_provider
      properties:
        navigation_url:
          type: string
          format: uri
          description: Complete navigation URL
        service_provider:
          type: string
          description: Mapping service provider
        transport_mode:
          type: string
          description: Transport mode used
        encoded_locations:
          type: object
          properties:
            origin:
              type: string
            destination:
              type: string
        alternatives:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
              provider:
                type: string
              description:
                type: string

    BrowserSessionData:
      type: object
      required:
        - session_id
        - browser_type
        - page_url
      properties:
        session_id:
          type: string
          description: Unique browser session identifier
        browser_type:
          type: string
          description: Browser type used
        page_url:
          type: string
          description: Final page URL
        headless:
          type: boolean
          description: Whether browser runs in headless mode
        launch_time_ms:
          type: integer
          description: Browser launch time in milliseconds
        navigation_time_ms:
          type: integer
          description: Page navigation time in milliseconds
        user_agent:
          type: string
          description: Browser user agent string

    LocationEntity:
      type: object
      required:
        - name
        - type
        - confidence
      properties:
        name:
          type: string
          description: Location name
        type:
          type: string
          enum: [city, district, landmark, transport, university, address, unknown]
        confidence:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
        context:
          type: string
          description: Additional context
        alternatives:
          type: array
          items:
            type: string
          description: Alternative names
        parent_region:
          type: string
          description: Parent administrative region
        extraction_method:
          type: string
          description: Method used for extraction

    ProcessingMetadata:
      type: object
      required:
        - processing_time_ms
        - timestamp
      properties:
        processing_time_ms:
          type: integer
          description: Processing time in milliseconds
        timestamp:
          type: string
          format: date-time
          description: Processing timestamp
        version:
          type: string
          description: API version
        component_times:
          type: object
          description: Individual component processing times
          properties:
            parsing_ms:
              type: integer
            construction_ms:
              type: integer
            browser_ms:
              type: integer

    ErrorResponse:
      type: object
      required:
        - error
        - message
        - timestamp
      properties:
        error:
          type: string
          description: Error type identifier
        message:
          type: string
          description: Human-readable error message
        timestamp:
          type: string
          format: date-time
          description: Error timestamp
        details:
          type: object
          description: Additional error details
        suggestions:
          type: array
          items:
            type: string
          description: Suggestions for resolving the error
        request_id:
          type: string
          description: Request identifier for debugging

  # Security Schemes
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for internal service authentication

# Global Security
security:
  - ApiKeyAuth: []

# Tags
tags:
  - name: Parsing
    description: Natural language parsing operations
  - name: URL Construction
    description: Navigation URL construction
  - name: Browser Automation
    description: Browser launch and navigation
  - name: Health
    description: System health and monitoring